services:
  db:
    image: pgvector/pgvector:pg16
    container_name: doc_poc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-doc_poc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-doc_poc}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: doc_poc_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/doc_poc}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql://postgres:postgres@db:5432/doc_poc}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-30}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-4000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_FILES_PER_CONVERSATION: ${MAX_FILES_PER_CONVERSATION:-10}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-5}
      INGEST_FAKE_DELAY_SECONDS: ${INGEST_FAKE_DELAY_SECONDS:-0}
      DIRECT_MAX_PAGES: ${DIRECT_MAX_PAGES:-40}
      DIRECT_MAX_MB: ${DIRECT_MAX_MB:-20}
      DIRECT_MAX_TOTAL_TOKENS: ${DIRECT_MAX_TOTAL_TOKENS:-300000}
      GEMINI_FILE_UPLOAD_TIMEOUT_SECONDS: ${GEMINI_FILE_UPLOAD_TIMEOUT_SECONDS:-30}
      CSV_MAX_ROWS_DIRECT: ${CSV_MAX_ROWS_DIRECT:-200}
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
      DOCLING_MEM_LIMIT: ${DOCLING_MEM_LIMIT:-3500M}
      PARSE_MODE: ${PARSE_MODE:-rag_only}
      PARSE_BATCH_PAGES: ${PARSE_BATCH_PAGES:-10}
      PARSE_CONCURRENCY: ${PARSE_CONCURRENCY:-1}
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-300}
      PARSE_OCR_ENABLED: ${PARSE_OCR_ENABLED:-false}
      PARSE_MIN_CHARS_PER_PAGE: ${PARSE_MIN_CHARS_PER_PAGE:-50}
      # Stage 6 Chunking & Embedding
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-600}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-900}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-80}
      CHUNK_MIN_TOKENS: ${CHUNK_MIN_TOKENS:-60}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-004}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-100}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-768}
      EMBED_CONCURRENCY: ${EMBED_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: doc_poc_web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  docling:
    image: ${DOCLING_IMAGE_TAG:-ghcr.io/docling-project/docling-serve-cpu:latest}
    container_name: doc_poc_docling
    restart: unless-stopped
    environment:
      - DOCLING_SERVE_ENABLE_UI=false
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    volumes:
      - docling_cache:/root/.cache
    deploy:
      resources:
        limits:
          memory: ${DOCLING_MEM_LIMIT:-3500M}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  uploads:
  docling_cache:
